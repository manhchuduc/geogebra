name: Build portable desktop releases

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.platform }} package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            script: build-portable-linux.sh
          - platform: windows
            script: build-portable-windows.sh
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build portable package
        run: ./${{ matrix.script }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: source/desktop/desktop/build/distributions/geogebra-classic5-portable-${{ matrix.platform }}-x64.*
          if-no-files-found: error

  release:
    name: Upload packages to release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            geogebra-classic5-portable-linux-x64.tar.gz \
            geogebra-classic5-portable-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
