name: Build web app

on:
  pull_request:
    paths:
      - "source/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - ".github/workflows/web-build.yml"
  push:
    branches:
      - main
    paths:
      - "source/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Compile web app
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build web app
        run: ./gradlew -p source/web :web:prepareS3Upload

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geogebra-web-build
          path: |
            source/web/web/war/
            source/web/web/build/s3/
            source/web/web/build/symbolMapsGz/
          if-no-files-found: error
